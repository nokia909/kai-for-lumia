                list.appendChild(b);
                rowRefs[num] = b;
              })(n);
            }
          })(SAGAS[s]);
        }
      }

      btnOriginal.onclick = function () { setEdition('original'); };
      btnFaulconer.onclick = function () { setEdition('faulconer'); };
      btnPrev.onclick = function () { hideResumeNote(); selectEpisode(current - 1, true); };
      btnNext.onclick = function () { hideResumeNote(); selectEpisode(current + 1, true); };
      document.getElementById('btnRetry').onclick = function () {
        var keep = 0;
        if (pendingSeek !== null && !seekApplied) keep = pendingSeek;
        else { try { keep = video.currentTime || 0; } catch (e) {} }
        if (keep > 5) { selectEpisode(current, true, keep); }
        else { selectEpisode(current, true); }
      };
      btnRestart.onclick = function () {
        pendingSeek = null;
        seekApplied = true;
        hideResumeNote();
        try { video.currentTime = 0; } catch (e) {}
        saveResumeAt(current, edition, 0);
        try { video.play(); } catch (e2) {}
      };

      video.onerror = function () {
        if (!video.src) return;
        if (!triedFallback) {
          triedFallback = true;
          video.src = epFallbackUrl(current);
          try { video.play(); } catch (e) {}
        } else {
          showError();
        }
      };

      video.onloadedmetadata = function () { applyPendingSeek(); };
      video.oncanplay = function () { applyPendingSeek(); };
      video.onseeked = function () { saveResume(); };

      video.ontimeupdate = function () {
        var nowMs = 0;
        try { nowMs = new Date().getTime(); } catch (e) {}
        if (nowMs - lastSaveAt >= 5000) {
          lastSaveAt = nowMs;
          saveResume();
        }
      };

      video.onpause = function () { saveResume(); };
      video.onplay = function () { saveResume(); };

      video.onended = function () {
        if (current < TOTAL) {
          hideResumeNote();
          saveResumeAt(current + 1, edition, 0);
          selectEpisode(current + 1, true);
        } else {
          saveResumeAt(current, edition, 0);
        }
      };

      if (window.addEventListener) {
        window.addEventListener('beforeunload', function () { saveResume(); }, false);
        window.addEventListener('pagehide', function () { saveResume(); }, false);
      } else if (window.attachEvent) {
        window.attachEvent('onbeforeunload', function () { saveResume(); });
      }

      buildList();

      /* ----- restore: episode + timestamp remembered on this device ----- */
      (function () {
        var saved = loadResume();
        if (saved) {
          var ep = saved.ep;
          var t = saved.t;
          var dur = saved.dur;
          /* Finished (or nearly finished) last time: move on to the next episode. */
          if (dur > 0 && t > 0 && t >= dur - 15) {
            if (ep < TOTAL) { ep = ep + 1; }
            t = 0;
          }
          if (saved.ed !== edition) {
            edition = saved.ed;
            btnOriginal.className = (edition === 'original') ? 'sel' : '';
            btnFaulconer.className = (edition === 'faulconer') ? 'sel' : '';
          }
          if (ep !== 1 || t > 5 || edition !== 'original') {
            restoredOnLoad = (t > 5);
            if (t > 5) { selectEpisode(ep, false, t); showResumeNote(ep, t); }
            else { selectEpisode(ep, false); }
            return;
          }
        }
        markSelected();
      })();
    </script>
  </body>
</html>
